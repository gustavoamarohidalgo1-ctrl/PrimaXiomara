name: Comprobar Servitotal con Python oficial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-oficial:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Obtener archivos de Servitotal
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Comprobar apertura con Python oficial y conservación de datos ficticios
        shell: pwsh
        run: python instaladores/construccion/verificar_python_windows.py --zip instaladores/Servitotal-1.7.1-Windows-Python.zip --evidencia evidencia-python-windows.json

      - name: Conservar evidencia de la prueba
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidencia-servitotal-python-windows
          path: evidencia-python-windows.json
          if-no-files-found: warn
          retention-days: 14
